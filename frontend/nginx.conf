server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode — serve index.html for all unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container.
    # The browser calls http://localhost/api/v0/... and nginx forwards
    # them to http://backend:8080/api/v0/... internally — no CORS needed.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
